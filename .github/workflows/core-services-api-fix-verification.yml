name: CORE-SERVICES API Fix Verification

on:
  push:
    branches:
      - fix/ltsa-messaging-gateway-implementation
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  core-services-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production requirements
        run: pip install -r CORE-SERVICES/BACKEND-API/requirements.txt
      - name: Install test-runner-only dependencies (pytest + httpx; verified in MWO-IT-001 Phase 2.9)
        run: pip install pytest "httpx>=0.27.0,<0.29.0"
      - name: Run CORE-SERVICES/API tests
        env:
          PYTHONPATH: ${{ github.workspace }}/CORE-SERVICES:${{ github.workspace }}/AI5R-SDK
        run: |
          python -m pytest CORE-SERVICES/API/TESTS -q
