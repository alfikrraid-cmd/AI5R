name: TAP LTSA Group Agent CI

on:
  push:
    branches:
      - feature/tap-ltsa-group-agent
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production requirements
        run: pip install -r CORE-SERVICES/BACKEND-API/requirements.txt
      - name: Install approved test requirements
        run: pip install -r CORE-SERVICES/BACKEND-API/requirements-dev.txt
      - name: Run BACKEND-API tests (includes existing WhatsApp/Copilot/Equipment360 regression)
        run: |
          cd CORE-SERVICES/BACKEND-API
          python -m pytest TESTS -q

  core-services-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production requirements
        run: pip install -r CORE-SERVICES/BACKEND-API/requirements.txt
      - name: Install approved test requirements
        run: pip install -r CORE-SERVICES/BACKEND-API/requirements-dev.txt
      - name: Run CORE-SERVICES/API tests (includes new Group Agent service tests)
        env:
          PYTHONPATH: ${{ github.workspace }}/CORE-SERVICES:${{ github.workspace }}/AI5R-SDK
        run: |
          python -m pytest CORE-SERVICES/API/TESTS -q

  group-agent-node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CORE-SERVICES/TAP-LTSA-GROUP-AGENT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies (pinned lockfile)
        run: npm ci
      - name: Run pure message-pipeline / transport-wiring tests
        run: npm test
